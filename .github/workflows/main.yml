name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Automatic Application Assembly
      run: |
        # إنشاء مشروع أندرويد مستقل وخالٍ من التعارضات
        flutter create --org com.fadisayegh --platforms=android fadi_solar_app
        cd fadi_solar_app
        
        # حقن كود الحسابات الهندسي الخاص بالمهندس فادي
        cat ../main.dart > lib/main.dart
        
        # بناء التطبيق بأمر التجميع السريع والمباشر
        flutter build apk --release --no-pub --split-per-abi

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: fadi_solar_app/build/app/outputs/flutter-apk/*.apk

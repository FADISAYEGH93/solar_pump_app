name: Build Flutter APK Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Clean and Create Fresh Project Structure
      run: |
        # حذف أي بقايا قديمة وإنشاء مشروع أندرويد نظيف وخالٍ من التعارضات تماماً
        rm -rf solar_pump_app fadi_solar_app
        flutter create --org com.fadisayegh --platforms=android fadi_solar_app
        cd fadi_solar_app
        
        # حقن كود الحسابات الهندسي النظيف الخاص بك داخل المشروع الجديد
        cat ../main.dart > lib/main.dart
        
        # إصلاح ملف settings.gradle ليتوافق هندسياً مع القيود المفروضة في السيرفرات ويمنع التعارض كلياً
        cat << 'EOF' > android/settings.gradle
        include ':app'
        def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
        def localProperties = new Properties()
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
        }
        def flutterSdkPath = localProperties.getProperty('flutter.sdk')
        if (flutterSdkPath == null) {
            throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
        }
        includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
        EOF

        # بناء التطبيق بأمر التجميع الرسمي والسريع
        flutter build apk --release --split-per-abi

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: fadi_solar_app/build/app/outputs/flutter-apk/*.apk

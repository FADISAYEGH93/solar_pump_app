name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Extract Project Files
      run: |
        unzip "Solar pump app.zip" -d extracted_project
        cd extracted_project/solar_pump_app
        flutter clean
        flutter pub get

    - name: Build Android APK
      run: |
        cd extracted_project/solar_pump_app
        flutter build apk --release --split-per-abi

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: extracted_project/solar_pump_app/build/app/outputs/flutter-apk/*.apk

name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Auto Create Clean Project Structure
      run: |
        # إنشاء مشروع فلاتر نظيف وجديد كلياً في ثوانٍ
        flutter create --org com.fadisayegh --platforms=android solar_pump_app
        cd solar_pump_app
        
        # صناعة المجلدات الافتراضية للصور
        mkdir -p assets/images
        echo "Mock Image" > assets/images/icon.png
        echo "Mock Splash" > assets/images/splash.png
        
        # قراءة الأكواد النظيفة التي رفعها المهندس فادي واستبدالها في المشروع الجديد
        cat ../main.dart > lib/main.dart
        cat ../pubspec.yaml > pubspec.yaml
        
        # تحديث الحزم البرمجية محلياً في السيرفر
        flutter pub get

    - name: Build Android APK
      run: |
        cd solar_pump_app
        flutter build apk --release --split-per-abi

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: solar_pump_app/build/app/outputs/flutter-apk/*.apk

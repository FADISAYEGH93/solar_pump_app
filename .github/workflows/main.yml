name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Extract ZIP File Safely
      run: |
        mkdir extracted_project
        unzip "*.zip" -d extracted_project
        
        # البحث التلقائي عن المجلد الذي يحتوي على ملف pubspec.yaml والدخول إليه
        TARGET_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
        echo "Target directory is: $TARGET_DIR"
        echo "TARGET_PATH=$TARGET_DIR" >> $GITHUB_ENV

    - name: Get Flutter Dependencies
      run: |
        cd ${{ env.TARGET_PATH }}
        flutter clean
        flutter pub get

    - name: Build Android APK
      run: |
        cd ${{ env.TARGET_PATH }}
        flutter build apk --release --split-per-abi

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: ${{ env.TARGET_PATH }}/build/app/outputs/flutter-apk/*.apk
